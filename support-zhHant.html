<h1>Snap 支援</h1>
<p>Snap 是常駐選單列的 macOS 截圖工具，不顯示在 Dock。點選單列右上角的 Snap 圖示即可開啟選單。</p>
<h2>第一次截圖沒有畫面</h2>
<p>打開「系統設定 → 隱私權與安全性 → 螢幕錄製」，勾選 Snap，然後結束並重新開啟 Snap。</p>
<h2>快速鍵</h2>
<p>⌃⌥1 區域 · ⌃⌥2 捲動長截圖 · ⌃⌥3 GIF · ⌃⌥4 視窗 · ⌃⌥5 全螢幕 · ⌃⌥6 OCR · ⌃⌥7 辨識上一張 · ⌃⌥8 重截上次區域。可在設定中修改。</p>
<h2>檔案在哪裡</h2>
<p>截圖歷史在應用程式支援目錄，可從選單選擇「開啟資料夾」。</p>
