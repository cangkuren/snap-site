<h1>Snap 隱私政策</h1>
<p>Updated: 2026-10-28</p>
<p>Snap 是在 Mac 上執行的截圖工具。我們不出售、不收集、不上傳你的截圖、文字或任何個人資料。</p>
<h2>本機處理</h2>
<p>截圖、長截圖、錄影與文字辨識都在你的 Mac 上完成。截圖歷史保存在本機的應用程式支援目錄，只有你能存取。只有你主動儲存、複製或分享時，內容才會離開 Snap。</p>
<h2>不收集資料</h2>
<p>沒有帳號、沒有分析、沒有廣告，也沒有第三方追蹤 SDK。截圖與辨識結果不會傳送到伺服器。</p>
<h2>系統權限</h2>
<p>螢幕錄製權限只用於截取你主動選擇的區域。Snap 不申請輔助功能權限。</p>
<h2>聯絡</h2>
<p>隱私問題請寄信到 <a href="mailto:boringbu@gmail.com">boringbu@gmail.com</a>。</p>
