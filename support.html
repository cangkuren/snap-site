<h1>Snap 支持</h1>
<p>Snap 是常驻菜单栏的截图工具，不显示在程序坞。点屏幕右上角的 Snap 图标打开菜单。</p>
<h2>首次截图没有画面</h2>
<p>打开“系统设置 → 隐私与安全性 → 屏幕录制”，勾选 Snap，然后退出并重新打开 Snap。</p>
<h2>快捷键</h2>
<p>⌃⌥1 区域截图 · ⌃⌥2 滚动长截图 · ⌃⌥3 录制 GIF · ⌃⌥4 窗口截图 · ⌃⌥5 全屏截图 · ⌃⌥6 框选 OCR · ⌃⌥7 识别上一张 · ⌃⌥8 重截上次区域。可在设置里修改。</p>
<h2>文件保存在哪</h2>
<p>截图历史在应用支持目录中，可在菜单里选“打开文件夹”。</p>
